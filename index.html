<head>
    <meta charset="UTF-8">
    <title>Antibiotic Sensitivity Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdfdfd;
            padding: 20px;
        }
        select {
            margin: 10px;
            padding: 6px;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #e0e0e0;
        }
        .green { background-color: #d4edda; }
        .yellow { background-color: #fff3cd; }
        .red { background-color: #f8d7da; }
        .gray { background-color: #e2e3e5; }
    </style>
</head>
<body>

<h2>Antibiotic Sensitivity Viewer</h2>

<label for="group">Group:</label>
<select id="group" onchange="updateOrganisms()">
    <option value="">-- Select Group --</option>
    <option value="Gram-positive">Gram-positive</option>
    <option value="Gram-negative">Gram-negative</option>
    <option value="Fungal infections">Fungal infections</option>
</select>

<label for="organism">Organism:</label>
<select id="organism" onchange="showData()">

</select>

function updateOrganisms() {
    const group = document.getElementById("group").value;
    const orgSelect = document.getElementById("organism");
    orgSelect.innerHTML = "<option value=''>-- Select Organism --</option>";

    if (DATA[group]) {
        const organisms = Object.keys(DATA[group]).sort();
        organisms.forEach(org => {
            const option = document.createElement("option");
            option.value = org;
            option.text = org + " (" + DATA[group][org].count + ")";
            orgSelect.appendChild(option);
        });
    }
}

function showData() {
    const group = document.getElementById("group").value;
    const organism = document.getElementById("organism").value;
    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    if (DATA[group] && DATA[group][organism]) {
        const agents = DATA[group][organism].antibiotics;
        for (let [abx, val] of Object.entries(agents)) {
            let color = "gray";
            if (val >= 80) color = "green";
            else if (val >= 70) color = "yellow";
            else if (val >= 0) color = "red";

            const row = `<tr><td>${abx}</td><td class="${color}">${val.toFixed(1)}%</td></tr>`;
            tbody.innerHTML += row;
        }
    }
}
